name: Netflix-style Nuvio Preview APK

on:
  push:
    branches:
      - netflix-home-redesign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvio-preview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build installable Android TV preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare optional local properties
        run: |
          touch local.properties
          touch local.dev.properties

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Nuvio Preview,O=Personal Build,C=BE" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-preview-full-debug
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
